naftiko: 1.0.0-alpha2
info:
  label: Apache Software Foundation Whimsy Public Data API — ICLA
  description: 'Apache Software Foundation Whimsy Public Data API — ICLA. 1 operations. Lead operation: Apache Software Foundation
    Get ICLA Information. Self-contained Naftiko capability covering one Apache Software Foundation business surface.'
  tags:
  - Apache Software Foundation
  - ICLA
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APACHE_SOFTWARE_FOUNDATION_API_KEY: APACHE_SOFTWARE_FOUNDATION_API_KEY
capability:
  consumes:
  - type: http
    namespace: whimsy-icla
    baseUri: https://whimsy.apache.org/public
    description: Apache Software Foundation Whimsy Public Data API — ICLA business capability. Self-contained, no shared references.
    resources:
    - name: icla-info.json
      path: /icla-info.json
      operations:
      - name: geticlainfo
        method: GET
        description: Apache Software Foundation Get ICLA Information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: whimsy-icla-rest
    port: 8080
    description: REST adapter for Apache Software Foundation Whimsy Public Data API — ICLA. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/icla-info-json
      name: icla-info-json
      description: REST surface for icla-info.json.
      operations:
      - method: GET
        name: geticlainfo
        description: Apache Software Foundation Get ICLA Information
        call: whimsy-icla.geticlainfo
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: whimsy-icla-mcp
    port: 9090
    transport: http
    description: MCP adapter for Apache Software Foundation Whimsy Public Data API — ICLA. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: apache-software-foundation-get-icla
      description: Apache Software Foundation Get ICLA Information
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: whimsy-icla.geticlainfo
      outputParameters:
      - type: object
        mapping: $.
