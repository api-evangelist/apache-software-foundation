naftiko: 1.0.0-alpha2
info:
  label: Apache Software Foundation Projects API — Committees
  description: 'Apache Software Foundation Projects API — Committees. 1 operations. Lead operation: Apache Software Foundation
    Get All Committees. Self-contained Naftiko capability covering one Apache Software Foundation business surface.'
  tags:
  - Apache Software Foundation
  - Committees
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APACHE_SOFTWARE_FOUNDATION_API_KEY: APACHE_SOFTWARE_FOUNDATION_API_KEY
capability:
  consumes:
  - type: http
    namespace: projects-committees
    baseUri: https://projects.apache.org/json
    description: Apache Software Foundation Projects API — Committees business capability. Self-contained, no shared references.
    resources:
    - name: foundation-committees.json
      path: /foundation/committees.json
      operations:
      - name: getcommittees
        method: GET
        description: Apache Software Foundation Get All Committees
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: projects-committees-rest
    port: 8080
    description: REST adapter for Apache Software Foundation Projects API — Committees. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/foundation/committees-json
      name: foundation-committees-json
      description: REST surface for foundation-committees.json.
      operations:
      - method: GET
        name: getcommittees
        description: Apache Software Foundation Get All Committees
        call: projects-committees.getcommittees
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: projects-committees-mcp
    port: 9090
    transport: http
    description: MCP adapter for Apache Software Foundation Projects API — Committees. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: apache-software-foundation-get-all
      description: Apache Software Foundation Get All Committees
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: projects-committees.getcommittees
      outputParameters:
      - type: object
        mapping: $.
