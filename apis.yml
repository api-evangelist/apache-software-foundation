aid: apache-software-foundation
name: Apache Software Foundation
description: >-
  APIs for the Apache Software Foundation (ASF), a nonprofit organization that supports the development of open-source
  software projects under the Apache License, providing governance, legal protection, and infrastructure for over 350
  projects. The ASF exposes public APIs for project discovery, committee governance data, member information, and
  organizational structure through its Projects API and Whimsy Public Data API.
