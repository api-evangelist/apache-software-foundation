apis:
  - aid: apache-software-foundation:projects-api
    name: Apache Software Foundation Projects API
    tags:
      - Open Source
      - Projects
      - Committees
    humanURL: https://projects.apache.org/
    properties:
      - url: https://projects.apache.org/
        type: Documentation
      - url: openapi/apache-software-foundation-projects-api-openapi.yml
        type: OpenAPI
      - url: json-schema/apache-software-foundation-project-schema.json
        type: JSONSchema
      - url: json-schema/apache-software-foundation-committee-schema.json
        type: JSONSchema
      - url: json-schema/apache-software-foundation-podling-schema.json
        type: JSONSchema
    description: >-
      The Apache Software Foundation Projects API provides read-only access to
      JSON data about ASF projects, committees, releases, and podlings. The data
      is served as static JSON files from projects.apache.org and includes
      comprehensive information about the foundation's structure, project
      metadata, committee membership, release histories, and incubating podlings.
  - aid: apache-software-foundation:whimsy-api
    name: Apache Software Foundation Whimsy Public Data API
    tags:
      - Open Source
      - Governance
      - Members
    humanURL: https://whimsy.apache.org/public/
    properties:
      - url: https://whimsy.apache.org/public/
        type: Documentation
      - url: openapi/apache-software-foundation-whimsy-api-openapi.yml
        type: OpenAPI
    description: >-
      The Apache Whimsy Public Data API provides access to publicly available
      information about the Apache Software Foundation's organizational
      structure. It exposes data about committees, members, committers, and
      ICLA (Individual Contributor License Agreement) information. The data
      is maintained by the ASF Secretary and Whimsy tooling.
