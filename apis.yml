  name: Apache Software Foundation Projects API
  description: >-
    The Apache Software Foundation Projects API provides read-only access to JSON data about ASF projects,
    committees, releases, and podlings. The data is served as static JSON files from projects.apache.org
    and includes comprehensive information about the foundation's structure, project metadata, committee
    membership, release histories, and incubating podlings.
