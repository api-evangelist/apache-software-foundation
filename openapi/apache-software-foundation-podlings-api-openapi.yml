openapi: 3.2.0
info:
  title: Apache Software Foundation Whimsy Public Data Podlings API
  description: The Apache Whimsy Public Data API provides access to publicly available information about the Apache Software Foundation's organizational structure. It exposes data about committees, members, committers, and ICLA (Individual Contributor License Agreement) information. The data is maintained by the ASF Secretary and Whimsy tooling.
  version: 1.0.0
  contact:
    name: Apache Software Foundation
    url: https://whimsy.apache.org
  license:
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://whimsy.apache.org/public
  description: Whimsy Public Data Server
tags:
- name: Podlings
paths:
  /public_podlings.json:
    get:
      operationId: getPublicPodlings
      summary: Apache Software Foundation Get Podlings Data
      description: Returns information about incubator podlings, including their status, description, sponsor, mentors, and key dates.
      tags:
      - Podlings
      responses:
        '200':
          description: Successful response with podlings data
          content:
            application/json:
              schema:
                type: object
                properties:
                  podling:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/WhimsyPodling'
                  last_updated:
                    type: string
              examples:
                GetPublicPodlings200Example:
                  summary: Default getPublicPodlings 200 response
                  x-microcks-default: true
                  value: {}
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    WhimsyPodling:
      type: object
      properties:
        name:
          type: string
          description: Display name of the podling
        status:
          type: string
          enum:
          - current
          - graduated
          - retired
          description: Current incubation status
        description:
          type: string
          description: Brief description of the podling
        mentors:
          type: array
          items:
            type: string
          description: List of mentor Apache IDs
        sponsor:
          type: string
          description: Sponsoring entity
        startdate:
          type: string
          description: Incubation start date
        enddate:
          type: string
          description: Incubation end date if applicable
