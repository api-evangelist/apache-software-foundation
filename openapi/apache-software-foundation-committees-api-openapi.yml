openapi: 3.2.0
info:
  title: Apache Software Foundation Whimsy Public Data Committees API
  description: The Apache Whimsy Public Data API provides access to publicly available information about the Apache Software Foundation's organizational structure. It exposes data about committees, members, committers, and ICLA (Individual Contributor License Agreement) information. The data is maintained by the ASF Secretary and Whimsy tooling.
  version: 1.0.0
  contact:
    name: Apache Software Foundation
    url: https://whimsy.apache.org
  license:
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://whimsy.apache.org/public
  description: Whimsy Public Data Server
tags:
- name: Committees
paths:
  /committee-info.json:
    get:
      operationId: getCommitteeInfo
      summary: Apache Software Foundation Get Committee Info
      description: Returns detailed information about all ASF committees (PMCs), including their chairs, established dates, reporting schedules, and full member rosters with join dates.
      tags:
      - Committees
      responses:
        '200':
          description: Successful response with committee information
          content:
            application/json:
              schema:
                type: object
                properties:
                  committees:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/CommitteeInfo'
                  last_updated:
                    type: string
                    description: Timestamp of last data update
              examples:
                GetCommitteeInfo200Example:
                  summary: Default getCommitteeInfo 200 response
                  x-microcks-default: true
                  value: {}
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /public_ldap_committees.json:
    get:
      operationId: getPublicLdapCommittees
      summary: Apache Software Foundation Get LDAP Committee Data
      description: Returns committee data sourced from ASF LDAP, listing all PMCs and their member rosters by Apache ID.
      tags:
      - Committees
      responses:
        '200':
          description: Successful response with LDAP committee data
          content:
            application/json:
              schema:
                type: object
                properties:
                  committees:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        roster:
                          type: array
                          items:
                            type: string
                  last_updated:
                    type: string
              examples:
                GetPublicLdapCommittees200Example:
                  summary: Default getPublicLdapCommittees 200 response
                  x-microcks-default: true
                  value: {}
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    CommitteeInfo:
      type: object
      properties:
        display_name:
          type: string
          description: Human-readable committee name
        chair:
          type: string
          description: Apache ID of the committee chair
        established:
          type: string
          description: Date the committee was established
        report:
          type: array
          items:
            type: string
          description: Reporting schedule months
        roster:
          type: object
          additionalProperties:
            type: object
            properties:
              name:
                type: string
              date:
                type: string
          description: Committee roster with member details
        pmc:
          type: boolean
          description: Whether this is a PMC
        description:
          type: string
          description: Brief description of the committee
