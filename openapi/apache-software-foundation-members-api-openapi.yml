openapi: 3.2.0
info:
  title: Apache Software Foundation Whimsy Public Data Members API
  description: The Apache Whimsy Public Data API provides access to publicly available information about the Apache Software Foundation's organizational structure. It exposes data about committees, members, committers, and ICLA (Individual Contributor License Agreement) information. The data is maintained by the ASF Secretary and Whimsy tooling.
  version: 1.0.0
  contact:
    name: Apache Software Foundation
    url: https://whimsy.apache.org
  license:
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://whimsy.apache.org/public
  description: Whimsy Public Data Server
tags:
- name: Members
paths:
  /member-info.json:
    get:
      operationId: getMemberInfo
      summary: Apache Software Foundation Get Member Information
      description: Returns publicly available information about ASF members, including member status and availability data.
      tags:
      - Members
      responses:
        '200':
          description: Successful response with member information
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        name:
                          type: string
                        status:
                          type: string
                  last_updated:
                    type: string
              examples:
                GetMemberInfo200Example:
                  summary: Default getMemberInfo 200 response
                  x-microcks-default: true
                  value: {}
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
