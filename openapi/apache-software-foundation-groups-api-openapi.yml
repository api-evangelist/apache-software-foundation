openapi: 3.2.0
info:
  title: Apache Software Foundation Whimsy Public Data Groups API
  description: The Apache Whimsy Public Data API provides access to publicly available information about the Apache Software Foundation's organizational structure. It exposes data about committees, members, committers, and ICLA (Individual Contributor License Agreement) information. The data is maintained by the ASF Secretary and Whimsy tooling.
  version: 1.0.0
  contact:
    name: Apache Software Foundation
    url: https://whimsy.apache.org
  license:
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://whimsy.apache.org/public
  description: Whimsy Public Data Server
tags:
- name: Groups
paths:
  /public_ldap_groups.json:
    get:
      operationId: getPublicLdapGroups
      summary: Apache Software Foundation Get LDAP Groups Data
      description: Returns Unix group data sourced from ASF LDAP, listing all groups and their member rosters by Apache ID.
      tags:
      - Groups
      responses:
        '200':
          description: Successful response with LDAP group data
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    roster:
                      type: array
                      items:
                        type: string
              examples:
                GetPublicLdapGroups200Example:
                  summary: Default getPublicLdapGroups 200 response
                  x-microcks-default: true
                  value: {}
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
