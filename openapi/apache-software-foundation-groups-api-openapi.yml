openapi: 3.1.0
info:
  title: Apache Software Foundation Projects Committees Groups API
  description: The Apache Software Foundation Projects API provides read-only access to JSON data about ASF projects, committees, releases, and podlings. The data is served as static JSON files from projects.apache.org and includes comprehensive information about the foundation's structure, project metadata, committee membership, release histories, and incubating podlings.
  version: 1.0.0
  contact:
    name: Apache Software Foundation
    url: https://www.apache.org
  license:
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://projects.apache.org/json
  description: ASF Projects JSON Data
tags:
- name: Groups
paths:
  /public_ldap_groups.json:
    get:
      operationId: getPublicLdapGroups
      summary: Apache Software Foundation Get LDAP Groups Data
      description: Returns Unix group data sourced from ASF LDAP, listing all groups and their member rosters by Apache ID.
      tags:
      - Groups
      responses:
        '200':
          description: Successful response with LDAP group data
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    roster:
                      type: array
                      items:
                        type: string
              examples:
                GetPublicLdapGroups200Example:
                  summary: Default getPublicLdapGroups 200 response
                  x-microcks-default: true
                  value: {}
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
