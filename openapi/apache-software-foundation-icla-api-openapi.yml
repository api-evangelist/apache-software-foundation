openapi: 3.2.0
info:
  title: Apache Software Foundation Whimsy Public Data ICLA API
  description: The Apache Whimsy Public Data API provides access to publicly available information about the Apache Software Foundation's organizational structure. It exposes data about committees, members, committers, and ICLA (Individual Contributor License Agreement) information. The data is maintained by the ASF Secretary and Whimsy tooling.
  version: 1.0.0
  contact:
    name: Apache Software Foundation
    url: https://whimsy.apache.org
  license:
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://whimsy.apache.org/public
  description: Whimsy Public Data Server
tags:
- name: ICLA
paths:
  /icla-info.json:
    get:
      operationId: getIclaInfo
      summary: Apache Software Foundation Get ICLA Information
      description: Returns public ICLA (Individual Contributor License Agreement) information, listing committers who have signed ICLAs along with their public names.
      tags:
      - ICLA
      responses:
        '200':
          description: Successful response with ICLA data
          content:
            application/json:
              schema:
                type: object
                properties:
                  committers:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Public name of the committer
                  last_updated:
                    type: string
              examples:
                GetIclaInfo200Example:
                  summary: Default getIclaInfo 200 response
                  x-microcks-default: true
                  value: {}
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
