openapi: 3.2.0
info:
  title: Apache Software Foundation Whimsy Public Data People API
  description: The Apache Whimsy Public Data API provides access to publicly available information about the Apache Software Foundation's organizational structure. It exposes data about committees, members, committers, and ICLA (Individual Contributor License Agreement) information. The data is maintained by the ASF Secretary and Whimsy tooling.
  version: 1.0.0
  contact:
    name: Apache Software Foundation
    url: https://whimsy.apache.org
  license:
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://whimsy.apache.org/public
  description: Whimsy Public Data Server
tags:
- name: People
paths:
  /public_ldap_people.json:
    get:
      operationId: getPublicLdapPeople
      summary: Apache Software Foundation Get LDAP People Data
      description: Returns public people data from ASF LDAP, including display names and group memberships for all committers.
      tags:
      - People
      responses:
        '200':
          description: Successful response with LDAP people data
          content:
            application/json:
              schema:
                type: object
                properties:
                  people:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        name:
                          type: string
                        key_fingerprints:
                          type: array
                          items:
                            type: string
                  last_updated:
                    type: string
              examples:
                GetPublicLdapPeople200Example:
                  summary: Default getPublicLdapPeople 200 response
                  x-microcks-default: true
                  value: {}
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
